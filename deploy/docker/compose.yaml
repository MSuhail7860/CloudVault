# LOCAL/TESTING ONLY. Do not expose this Compose project as a public deployment.
name: cloudvault-app-docker

x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: "8000"
  TRUST_PROXY_HOPS: "1"
  ALLOW_TEST_CLIENT_ISOLATION: "true"
  FRONTEND_URL: "http://localhost:${FRONTEND_HOST_PORT:-38080}"
  EMAIL_PROVIDER: ""
  EMAIL_FROM: ""
  RESEND_API_KEY: ""
  DATABASE_URL: "postgresql://${APP_DB_USER:-cloudvault_app}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME:-cloudvault_app}?schema=public"
  JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
  JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
  REDIS_ENABLED: "true"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  S3_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "${APP_S3_BUCKET:-cloudvault-app-files}"
  S3_ACCESS_KEY_ID: "${APP_S3_ACCESS_KEY_ID}"
  S3_SECRET_ACCESS_KEY: "${APP_S3_SECRET_ACCESS_KEY}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${APP_DB_NAME:-cloudvault_app}"
      POSTGRES_USER: "${APP_DB_USER:-cloudvault_app}"
      POSTGRES_PASSWORD: "${APP_DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q '^PONG$'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.minio
    image: cloudvault-app-minio:local
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-39001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  minio-init:
    build:
      context: ./deploy/docker
      dockerfile: Dockerfile.minio-init
    image: cloudvault-app-minio-init:local
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /tmp/mc
        export MC_CONFIG_DIR=/tmp/mc
        mc alias set app http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "app/$$APP_S3_BUCKET" >/dev/null
        mc admin policy info app cloudvault-app-storage >/dev/null 2>&1 || \
          mc admin policy create app cloudvault-app-storage /etc/cloudvault/minio-app-policy.json >/dev/null
        mc admin user info app "$$APP_S3_ACCESS_KEY_ID" >/dev/null 2>&1 || \
          mc admin user add app "$$APP_S3_ACCESS_KEY_ID" "$$APP_S3_SECRET_ACCESS_KEY" >/dev/null
        mc admin policy attach app cloudvault-app-storage --user "$$APP_S3_ACCESS_KEY_ID" >/dev/null
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      APP_S3_BUCKET: "${APP_S3_BUCKET:-cloudvault-app-files}"
      APP_S3_ACCESS_KEY_ID: "${APP_S3_ACCESS_KEY_ID}"
      APP_S3_SECRET_ACCESS_KEY: "${APP_S3_SECRET_ACCESS_KEY}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-internal
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: migrator
    image: "${APP_MIGRATOR_IMAGE:-cloudvault-app-migrator:local}"
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-internal
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: runtime
    image: "${APP_BACKEND_IMAGE:-cloudvault-app-backend:local}"
    environment:
      <<: *backend-environment
      EMAIL_CAPTURE_DIRECTORY: /var/lib/cloudvault/mail-capture
    user: "${APP_HOST_UID:-1000}:${APP_HOST_GID:-1000}"
    volumes:
      - ${MAIL_CAPTURE_DIRECTORY:-./deploy/docker/mail-capture}:/var/lib/cloudvault/mail-capture
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - app-internal
      - app-edge
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: "${APP_BACKEND_IMAGE:-cloudvault-app-backend:local}"
    command: ["node", "dist/jobs/worker.js"]
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - app-internal
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: "${APP_FRONTEND_IMAGE:-cloudvault-app-frontend:local}"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-38080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-edge
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-cloudvault-app-docker-postgres-data}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-cloudvault-app-docker-redis-data}
  minio-data:
    name: ${MINIO_VOLUME_NAME:-cloudvault-app-docker-minio-data}

networks:
  app-internal:
    name: ${APP_INTERNAL_NETWORK_NAME:-cloudvault-app-docker-internal}
    internal: true
  app-edge:
    name: ${APP_EDGE_NETWORK_NAME:-cloudvault-app-docker-edge}
    driver: bridge
